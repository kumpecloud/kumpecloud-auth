# KumpeCloud Auth production secondary stack (Node B).
#
# Spin up on a second VM with the peer Nebula IP of Node A. On first start,
# Postgres auto-clones from the primary; Logto joins round-robin once a writer
# is reachable via POSTGRES_HOST_IPS.
#
# Required:
#   POSTGRES_PASSWORD                 Same as Node A
#   POSTGRES_REPLICATION_PASSWORD     Same as Node A
#   PEER_POSTGRES_IP                  Nebula IP of Node A Postgres
#   POSTGRES_HOST_IPS                 Both Nebula IPs, e.g. 10.10.0.11,10.10.0.12
#   AUTH_ENDPOINT / ADMIN_ENDPOINT    Same public URLs as Node A
#   SECRET_VAULT_KEK                  Same as Node A
#
# Optional:
#   POSTGRES_HBA_ALLOWED_CIDRS        Extra Nebula CIDRs for replication pg_hba
#   KUMPECLOUD_AUTH_TAG               default stable
#   NODE_PRIORITY                     default 50 (yields to Node A on split-brain)
#   SKIP_DB_SEED                      default 1 on secondary (schema arrives via replication)

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: logto
      PEER_POSTGRES_IP: ${PEER_POSTGRES_IP:?PEER_POSTGRES_IP is required}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?POSTGRES_REPLICATION_PASSWORD is required}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_HOST_IPS: ${POSTGRES_HOST_IPS:-}
      POSTGRES_HBA_ALLOWED_CIDRS: ${POSTGRES_HBA_ALLOWED_CIDRS:-}
      NODE_NAME: ${NODE_NAME:-b}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/ha-common.sh:/ha-common.sh:ro
      - ../postgres/ha-entrypoint.sh:/ha-entrypoint.sh:ro
      - ../postgres/primary-init/00-replication.sh:/docker-entrypoint-initdb.d/00-replication.sh:ro
    entrypoint: ['/bin/sh', '/ha-entrypoint.sh']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d logto']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 120s

  failover-watch:
    image: postgres:17-alpine
    restart: unless-stopped
    user: postgres
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PEER_POSTGRES_IP: ${PEER_POSTGRES_IP:?PEER_POSTGRES_IP is required}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?POSTGRES_REPLICATION_PASSWORD is required}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_HOST_IPS: ${POSTGRES_HOST_IPS:-}
      POSTGRES_HBA_ALLOWED_CIDRS: ${POSTGRES_HBA_ALLOWED_CIDRS:-}
      NODE_NAME: ${NODE_NAME:-b}
      NODE_PRIORITY: ${NODE_PRIORITY:-50}
      FAIL_THRESHOLD: ${FAIL_THRESHOLD:-5}
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-5}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/ha-common.sh:/ha-common.sh:ro
      - ../postgres/failover-watch.sh:/failover-watch.sh:ro
    entrypoint: ['/bin/sh', '/failover-watch.sh']

  kumpecloud-auth:
    image: ghcr.io/kumpecloud/kumpecloud-auth:${KUMPECLOUD_AUTH_TAG:-stable}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3001:3001'
      - '3002:3002'
    environment:
      TRUST_PROXY_HEADER: '1'
      DEV_FEATURES_ENABLED: '1'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST_IPS: ${POSTGRES_HOST_IPS:?POSTGRES_HOST_IPS is required}
      PEER_POSTGRES_IP: ${PEER_POSTGRES_IP:?PEER_POSTGRES_IP is required}
      # Schema is replicated from Node A; skip seed on standby / fresh secondary.
      SKIP_DB_SEED: ${SKIP_DB_SEED:-1}
      ENDPOINT: ${AUTH_ENDPOINT:?AUTH_ENDPOINT is required}
      ADMIN_ENDPOINT: ${ADMIN_ENDPOINT:?ADMIN_ENDPOINT is required}
      ALL_YES: '1'
      NO_INQUIRY: '0'
      PRIVATE_KEY_ROTATION_GRACE_PERIOD: ${PRIVATE_KEY_ROTATION_GRACE_PERIOD:-}
      SECRET_VAULT_KEK: ${SECRET_VAULT_KEK:-}
    volumes:
      - ../scripts/auth-entrypoint.sh:/auth-entrypoint.sh:ro
    entrypoint: ['/bin/sh', '/auth-entrypoint.sh']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3001/api/status").then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

volumes:
  postgres_data:
