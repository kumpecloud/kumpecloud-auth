# KumpeCloud Auth staging stack for kumpeapps-deploy-bot.
#
# Required host environment variables (map via stage.yml env_mappings):
#   POSTGRES_PASSWORD Postgres password for the auth database
#
# ENDPOINT / ADMIN_ENDPOINT are fixed in this file (see stage.yml domains).
#
# Image tags:
#   edge    Rolling build from main (default below)
#   stable  Latest semver release (for production; see prod/docker-compose.yml)
#
# Optional:
#   KUMPECLOUD_AUTH_TAG  Image tag (default: edge)
#   PRIVATE_KEY_ROTATION_GRACE_PERIOD  OIDC key rotation grace period in seconds

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: logto
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d logto']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

# Optional MariaDB (Issue #99 cutover): set DB_URL=mariadb://logto:${POSTGRES_PASSWORD}@mariadb:3306/logto
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      MARIADB_DATABASE: logto
      MARIADB_USER: logto
      MARIADB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  kumpecloud-auth:
    image: ghcr.io/kumpecloud/kumpecloud-auth:${KUMPECLOUD_AUTH_TAG:-edge}
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      # Caddy reverse-proxies to the VM/Nebula IP on these ports.
      - '3001:3001'
      - '3002:3002'
    environment:
      TRUST_PROXY_HEADER: '1'
      DB_URL: mariadb://logto:${POSTGRES_PASSWORD}@mariadb:3306/logto
      ENDPOINT: https://auth.stage.kumpe.app
      ADMIN_ENDPOINT: https://auth-console.stage.kumpe.app
      ALL_YES: '1'
      NO_INQUIRY: '0'
      DEV_FEATURES_ENABLED: '1'
      PRIVATE_KEY_ROTATION_GRACE_PERIOD: ${PRIVATE_KEY_ROTATION_GRACE_PERIOD:-}
      SECRET_VAULT_KEK: ${SECRET_VAULT_KEK:-}
    entrypoint:
      - sh
      - -c
      - npm run cli db seed -- --swe --dapc && npm run cli db alteration deploy latest --dialect mariadb && npm run cli db alteration deploy next --dialect mariadb && exec npm start
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3001/api/status").then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  postgres_data:
  mariadb_data:
